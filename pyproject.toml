[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backoff-audit"
version = "0.1.0"
description = "Check whether a stream of retry attempt timestamps honors a backoff policy"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "emilym82" }]

[project.scripts]
backoff-audit = "backoffaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
